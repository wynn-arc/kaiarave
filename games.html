<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games — ZAIA ST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="page-content">
        <h1>Games</h1>
        <h2>Take a break and play a round</h2>

        <div class="minigame-section" id="catch">
            <h3>Catch the KAIAmojis!</h3>
            <p id="game-status">Click "Start" and catch as many emojis as you can in 30 seconds!</p>
            <div class="game-scoreboard">
                <span>Score: <span id="score">0</span></span>
                <span>Time: <span id="time">30</span>s</span>
            </div>
            <div id="game-area">
                <button id="start-btn">Start</button>
            </div>
            <div id="catch-postgame" class="postgame"></div>
            <div class="leaderboard-wrap">
                <h4 class="leaderboard-heading">Top scores</h4>
                <div id="catch-leaderboard"></div>
            </div>
        </div>

        <div class="minigame-section" id="memory">
            <h3>KAIA Memory Match</h3>
            <p id="mm-status">Click "Start" and find all the matching pairs!</p>
            <div class="game-scoreboard">
                <span>Moves: <span id="mm-moves">0</span></span>
                <span>Time: <span id="mm-time">0</span>s</span>
            </div>
            <div id="mm-game-area">
                <div id="mm-board"></div>
                <button id="mm-start-btn">Start</button>
            </div>
            <div id="mm-postgame" class="postgame"></div>
            <div class="leaderboard-wrap">
                <h4 class="leaderboard-heading">Top scores</h4>
                <div id="mm-leaderboard"></div>
            </div>
        </div>
    </div>

    <script src="nav-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="minigame.js"></script>
    <script src="memorygame.js"></script>
</body>
</html>
