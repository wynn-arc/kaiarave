<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ZAIA ST!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <h1>Hello!</h1>
    <h2>Welcome to the ZAIA stream team website!</h2>
    
    <div class="logo-container">
    <div class="vinyl"></div>
    <img src="assets/Raveteam.jpg" alt="rave logo" class="logo-img">

    <div class="spotify-embed">
        <iframe
            id="spotify-player"
            width="280" height="80" frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>
</div>
    <h4>Feel free to explore the website!</h4>

    <div class="minigame-section">
    <h3>Catch the KAIAmojis!</h3>
    <p id="game-status">Click "Start" and catch as many emojis as you can in 30 seconds!</p>
    <div class="game-scoreboard">
        <span>Score: <span id="score">0</span></span>
        <span>Time: <span id="time">30</span>s</span>
    </div>
    <div id="game-area">
        <button id="start-btn">Start</button>
    </div>
</div>

    <div class="minigame-section">
    <h3>KAIA Memory Match</h3>
    <p id="mm-status">Click "Start" and find all the matching pairs!</p>
    <div class="game-scoreboard">
        <span>Moves: <span id="mm-moves">0</span></span>
        <span>Time: <span id="mm-time">0</span>s</span>
    </div>
    <div id="mm-game-area">
        <div id="mm-board"></div>
        <button id="mm-start-btn">Start</button>
    </div>
</div>

    <script src="script.js"></script>
<script src="nav-loader.js"></script>
<script src="minigame.js"></script>
<script src="memorygame.js"></script>
</body>
</html>
